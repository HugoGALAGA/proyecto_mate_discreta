name: Continuous Integration & QA Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Code Quality & Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv (Fast Python Package Installer)
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements.txt

      - name: 1. Static Quality Gate (Linter - Ruff)
        run: |
          # Falla el CI si hay bugs o violaciones de código
          ruff check .

      - name: 2. Dynamic Quality Gate (Pytest + Coverage Threshold)
        run: |
          # Falla si la cobertura cae por debajo del 80% (definido en pyproject.toml)
          pytest --cov=src --cov-fail-under=80

      - name: Upload Coverage HTML Report (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/