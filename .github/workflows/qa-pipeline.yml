name: Continuous Integration & QA Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  python-gate:
    name: Python - Lint, Unit, Integration, Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: 1. Static Quality Gate (ruff)
        run: uv run ruff check .

      - name: 2. Dynamic Quality Gate (pytest + coverage 80%)
        run: uv run pytest -m "not e2e" --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80

      - name: Upload Coverage HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  frontend-gate:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build
