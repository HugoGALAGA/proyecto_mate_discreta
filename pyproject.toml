[project]
name = "proyecto-mate-discreta"
version = "0.1.0"
description = "Zombie Survival Engine - Matematica Discreta (UFM)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-html>=4.1",
    "pytest-playwright>=0.5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers -m 'not e2e'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Pruebas unitarias de algoritmos y reglas",
    "integration: Pruebas de integracion (partidas completas, API)",
    "property: Pruebas basadas en propiedades (Hypothesis)",
    "e2e: Pruebas de extremo a extremo con Playwright (requieren frontend compilado)",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
